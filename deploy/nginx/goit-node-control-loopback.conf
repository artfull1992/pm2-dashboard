# GOIT Node Control — isolated LOOPBACK site (ADR-012). Not public: listens only on 127.0.0.1:3101.
# Installed as /etc/nginx/sites-available/goit-node-control-loopback.conf + symlink in sites-enabled.
# Static UI from the active release; /api/ proxied to the API with the URI preserved (no SPA fallback for /api).
# Access: ssh -N -L 3101:127.0.0.1:3101 root@<server>

server {
    listen 127.0.0.1:3101;
    server_name localhost;

    root /opt/goit-node-control/current/frontend/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 64k;
    access_log /var/log/nginx/goit-node-control.access.log;
    error_log /var/log/nginx/goit-node-control.error.log warn;

    # API: proxy_pass without URI → original path and query are forwarded unchanged; unknown /api → API 404 JSON.
    # The browser's Origin header is forwarded as is (CSRF checks stay in the API). No X-Forwarded-* (trustProxy off).
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/goit-node-control-headers.conf;
    }

    # Hashed build assets: long, immutable cache. Missing asset → 404 (never index.html).
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/goit-node-control-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/goit-node-control-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback for frontend routes only.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/goit-node-control-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
